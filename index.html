<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DigiHust — Digital Services Handled by Specialized Talent</title>
    <meta name="description" content="DigiHust brings verified digital talent together to deliver web development, design, AI automation, marketing, and cybersecurity under one managed brand." />
    <meta id="theme-color-meta" name="theme-color" content="#071e26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DigiHust" />
    
    <!-- Synchronous Zero-FOUC Theme Initializer -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('digihust_theme_preference');
          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (theme === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#EFF1F5');
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#022B3A');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--bg-page)] text-[var(--text-body)] min-h-screen font-sans antialiased selection:bg-[var(--brand-teal)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
