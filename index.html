    <!-- Synchronous Zero-FOUC Theme Initializer -->
    <script>!function(){try{var t=localStorage.getItem("digihust_theme_preference")||"light",e=document.documentElement;e.setAttribute("data-theme",t);var a=document.getElementById("theme-color-meta");"dark"===t?(e.classList.remove("light"),e.classList.add("dark"),a&&a.setAttribute("content","#022B3A")):(e.classList.remove("dark"),e.classList.add("light"),a&&a.setAttribute("content","#EFF1F5"))}catch(t){}}();</script>

    <!-- Inlined Critical Boxes Loader CSS (<2KB) from Uiverse.io by Nawsome -->
    <style id="critical-boxes-loader-css">
      /* Critical Theme Variables for Zero-FOUC & Zero-Glitch Boot */
      :root,
      html.light,
      html[data-theme="light"] {
        color-scheme: light;
        --bg-page: #EFF3F6;
        --text-heading: #022B3A;
        --brand-teal: #1F7A8C;
        --loader-bg: #EFF3F6;
        --loader-text: #022B3A;
        --loader-accent: #1F7A8C;
      }
      html.dark,
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg-page: #022B3A;
        --text-heading: #FFFFFF;
        --brand-teal: #1F7A8C;
        --loader-bg: #022B3A;
        --loader-text: #FFFFFF;
        --loader-accent: #22D3EE;
      }
      html, body {
        background-color: var(--loader-bg);
        margin: 0;
        padding: 0;
      }
      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--loader-bg);
        transition: opacity 350ms cubic-bezier(0.16, 1, 0.3, 1), visibility 350ms;
        user-select: none;
      }
      #app-boot-splash.boot-splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boxes-loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 180px;
        position: relative;
      }
      .boxes {
        --size: 48px;
        --duration: 800ms;
        height: calc(var(--size) * 2);
        width: calc(var(--size) * 3);
        position: relative;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        margin-top: calc(var(--size) * 1.5 * -1);
        transform: rotateX(60deg) rotateZ(45deg) rotateY(0deg) translateZ(0px);
      }
      @media (max-width: 640px) {
        .boxes {
          --size: 40px;
        }
      }
      .boxes-ambient-stage {
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: #5C8DF6;
        opacity: 0.16;
        filter: blur(36px);
        pointer-events: none;
        transform: translateY(-20px);
      }
      .dark .boxes-ambient-stage,
      [data-theme="dark"] .boxes-ambient-stage {
        background: #22D3EE;
        opacity: 0.18;
      }
      .loader-progress-track {
        width: 140px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(31, 122, 140, 0.15);
        overflow: hidden;
        position: relative;
        margin-top: 14px;
      }
      .dark .loader-progress-track,
      [data-theme="dark"] .loader-progress-track {
        background: rgba(255, 255, 255, 0.12);
      }
      .loader-progress-bar {
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        background: #1F7A8C;
        transform-origin: left;
        animation: loaderProgress 1.6s ease-in-out infinite;
      }
      .dark .loader-progress-bar,
      [data-theme="dark"] .loader-progress-bar {
        background: #22D3EE;
      }
      @keyframes loaderProgress {
        0% { transform: scaleX(0); }
        50% { transform: scaleX(0.7); }
        100% { transform: scaleX(1); }
      }
      .boxes .box {
        width: var(--size);
        height: var(--size);
        top: 0;
        left: 0;
        position: absolute;
        transform-style: preserve-3d;
      }
      .boxes .box:nth-child(1) {
        transform: translate(100%, 0);
        -webkit-animation: box1 var(--duration) linear infinite;
        animation: box1 var(--duration) linear infinite;
      }
      .boxes .box:nth-child(2) {
        transform: translate(0, 100%);
        -webkit-animation: box2 var(--duration) linear infinite;
        animation: box2 var(--duration) linear infinite;
      }
      .boxes .box:nth-child(3) {
        transform: translate(100%, 100%);
        -webkit-animation: box3 var(--duration) linear infinite;
        animation: box3 var(--duration) linear infinite;
      }
      .boxes .box:nth-child(4) {
        transform: translate(200%, 0);
        -webkit-animation: box4 var(--duration) linear infinite;
        animation: box4 var(--duration) linear infinite;
      }
      .boxes .box > div {
        --background: #5C8DF6;
        --top: auto;
        --right: auto;
        --bottom: auto;
        --left: auto;
        --translateZ: calc(var(--size) / 2);
        --rotateY: 0deg;
        --rotateX: 0deg;
        position: absolute;
        width: 100%;
        height: 100%;
        background: var(--background);
        top: var(--top);
        right: var(--right);
        bottom: var(--bottom);
        left: var(--left);
        transform: rotateY(var(--rotateY)) rotateX(var(--rotateX)) translateZ(var(--translateZ));
      }
      .boxes .box > div:nth-child(1) {
        --top: 0;
        --left: 0;
      }
      .boxes .box > div:nth-child(2) {
        --background: #145af2;
        --right: 0;
        --rotateY: 90deg;
      }
      .boxes .box > div:nth-child(3) {
        --background: #447cf5;
        --rotateX: -90deg;
      }
      .boxes .box > div:nth-child(4) {
        --background: #DBE3F4;
        --top: 0;
        --left: 0;
        --translateZ: calc(var(--size) * 3 * -1);
      }
      .dark .boxes .box > div:nth-child(4),
      [data-theme="dark"] .boxes .box > div:nth-child(4) {
        --background: rgba(219, 227, 244, 0.25);
      }
      @-webkit-keyframes box1 {
        0%, 50% { transform: translate(100%, 0); }
        100% { transform: translate(200%, 0); }
      }
      @keyframes box1 {
        0%, 50% { transform: translate(100%, 0); }
        100% { transform: translate(200%, 0); }
      }
      @-webkit-keyframes box2 {
        0% { transform: translate(0, 100%); }
        50% { transform: translate(0, 0); }
        100% { transform: translate(100%, 0); }
      }
      @keyframes box2 {
        0% { transform: translate(0, 100%); }
        50% { transform: translate(0, 0); }
        100% { transform: translate(100%, 0); }
      }
      @-webkit-keyframes box3 {
        0%, 50% { transform: translate(100%, 100%); }
        100% { transform: translate(0, 100%); }
      }
      @keyframes box3 {
        0%, 50% { transform: translate(100%, 100%); }
        100% { transform: translate(0, 100%); }
      }
      @-webkit-keyframes box4 {
        0% { transform: translate(200%, 0); }
        50% { transform: translate(200%, 100%); }
        100% { transform: translate(100%, 100%); }
      }
      @keyframes box4 {
        0% { transform: translate(200%, 0); }
        50% { transform: translate(200%, 100%); }
        100% { transform: translate(100%, 100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boxes .box {
          animation: none !important;
          -webkit-animation: none !important;
        }
        .loader-progress-bar {
          animation: none !important;
          transform: scaleX(1) !important;
        }
      }
    </style>
  </head>

    <!-- React App Root Container -->
    <div id="root"></div>

    <!-- Boot Splash Dismissal Controller -->
    <script>
      window.__DIGIHUST_BOOT_TIME__ = Date.now();
      window.__dismissBootSplash = function() {
        var el = document.getElementById('app-boot-splash');
        if (!el || el.classList.contains('boot-splash-hidden')) return;
        el.classList.add('boot-splash-hidden');
        setTimeout(function() {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 400);
      };
      setTimeout(function() {
        if (typeof window.__dismissBootSplash === 'function') {
          window.__dismissBootSplash();
        }
      }, 3500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
